// ===========================================================================
// antipeek_spray.cfg - executed automatically on map load (cfg/maps/<mapname>.cfg)
// ===========================================================================
// AUTHORED COPY. The engine reads this from the GAME tree:
//     game/csgo_addons/asd/cfg/maps/antipeek_spray.cfg
// Copy it there after editing - the resourcecompiler does NOT copy cfg files,
// they are shipped verbatim.
//
// This runs BEFORE the first round is created and before peektrainer.js's
// OnPlayerActivate. It handles the things the script cannot fix from inside a
// running session; the script still asserts its own gameplay cvars afterwards,
// so this file stays deliberately minimal and does not duplicate tuning.

echo *** antipeek_spray.cfg: begin ***

// --- Game mode -------------------------------------------------------------
// THE critical lines. A workshop map launched from the UI can land in any
// mode; Competitive's match manager kicks every bot instantly. Custom (3/0)
// is what both Recoil Master and aim_botz ship. Nothing else here matters if
// these are missing.
game_alias custom
game_type 3
game_mode 0

// Keep per-map cfg execution enabled for subsequent loads.
sv_autoexec_mapname_cfg 1

// Required for the script's RegisterCheatCommand controls (peek_*, ui_press).
sv_cheats 1

// --- Warmup / freezetime ---------------------------------------------------
// The first round latches its freeze before any script runs, which is why
// bootServer()'s mp_freezetime 0 alone left a ~15-20 s freeze at session
// start. Setting it here, pre-round, is what actually removes it.
mp_warmup_offline_enabled 0
mp_warmup_online_enabled 0
mp_warmuptime 0
mp_freezetime 0
mp_warmup_end

// --- Round loop ------------------------------------------------------------
// A rep ending must never touch the player (PEEK_TRAINER_SPEC.md §2).
mp_ignore_round_win_conditions 1
mp_round_restart_delay 0
mp_match_end_restart 0
mp_maxrounds 0
// mp_timelimit 0 MUST NOT be set here. Pre-match it reads as "time already
// expired": the match spawns straight into game-over limbo - player frozen
// (can look, can't move/shoot), round clock 0:00, mp_restartgame silently
// swallowed. Bisected live 2026-07-18; the script sets it mid-session in
// bootServer(), which is safe.
mp_roundtime 60
mp_roundtime_defuse 60
mp_roundtime_hostage 60
mp_team_intro_time 0

// --- Teams / player --------------------------------------------------------
mp_humanteam CT
mp_autoteambalance 0
mp_limitteams 0
mp_autokick 0
mp_solid_teammates 0
mp_teammates_are_enemies 0
mp_free_armor 1
mp_respawn_immunitytime 0
mp_death_drop_gun 0
mp_give_player_c4 0
mp_buy_anywhere 1
mp_buytime 60000
mp_startmoney 65535
mp_maxmoney 65535
sv_infinite_ammo 1

// --- Bots ------------------------------------------------------------------
// Quota 1 on T, AI idled so only the trigger_push moves it. Do NOT bot_kick
// here: kicked defaults do not come back, and the script's quota enforcement
// expects a bot to exist. bot_stop/bot_dont_shoot - not bot_freeze/bot_zombie,
// a frozen bot is not shoved by the push.
bot_quota_mode normal
bot_quota 1
bot_join_team t
bot_join_after_player 1
bot_stop 1
bot_dont_shoot 1
bot_chatter off
bot_allow_grenades 0

// --- Respawn ---------------------------------------------------------------
// Currently unused (the bot's death is simulated), but pre-set so the real
// death path in PEEK_REAL_DEATH_TASKS.md needs no cfg change.
mp_respawn_on_death_t 1
mp_respawn_on_death_ct 1
mp_respawnwavetime_t 0
mp_respawnwavetime_ct 0
mp_use_respawn_waves 0

echo *** antipeek_spray.cfg: done ***

// User overrides, if the player chooses to create one. Never required.
execifexists antipeek_spray/userconfig.cfg
